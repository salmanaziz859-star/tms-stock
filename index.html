*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--txt)}
header{background:var(--navy);color:#fff;padding:16px 20px}
header h1{margin:0;font-size:26px;letter-spacing:1px}
header small{color:#BFD9F2;font-size:14px}
.wrap{max-width:1200px;margin:0 auto;padding:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:12px}
.card{background:#fff;border:1px solid var(--line);border-left:6px solid var(--blue);border-radius:12px;padding:12px 16px;cursor:default}
.card b{display:block;font-size:34px}
.card span{color:#5A6B85;font-size:15px}
.card.g{border-left-color:#00A651}.card.g b{color:#00A651}
.card.r{border-left-color:var(--red);cursor:pointer}.card.r b{color:var(--red)}
.card.b b{color:var(--blue)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.bar input{flex:1;min-width:220px;font-size:20px;padding:12px 14px;border:2px solid var(--line);border-radius:10px}
.bar button{font-size:17px;padding:12px 16px;border:0;border-radius:10px;background:#9AA5B5;color:#fff;font-weight:600;cursor:pointer}
.bar button.on{background:var(--red)}
.tw{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:20px}
th{background:var(--blue);color:#fff;padding:12px 10px;text-align:center;cursor:pointer;position:sticky;top:0;white-space:nowrap}
td{padding:11px 10px;text-align:center;border-top:1px solid #E3EAF4}
td:first-child,th:first-child{text-align:left}
tr:nth-child(even) td{background:#F3F7FC}
tr.out td{background:#FDE8E8;color:var(--red);font-weight:700}
tr.out:nth-child(even) td{background:#FAD4D4}
.badge{padding:3px 10px;border-radius:20px;font-size:15px;font-weight:700}
.ok{background:#DFF3E6;color:#0A7A3B}.no{background:var(--red);color:#fff}
.foot{color:#5A6B85;margin:10px 2px;font-size:15px}
@media(max-width:640px){table{font-size:17px}th.hm,td.hm{display:none}}
</style></head><body>
